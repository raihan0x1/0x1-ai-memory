name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI, Shell & Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax & ShellCheck
        run: |
          sh -n install.sh
          bash -n scripts/*.sh
          shellcheck install.sh scripts/*.sh
      - name: Check installer & npm launcher asset parity
        run: |
          while IFS= read -r asset; do
            stem="${asset%.tar.gz}"
            stem="${stem%.zip}"
            grep -Fq "asset: ${stem}" .github/workflows/release.yml || {
              echo "Missing asset '${stem}' in .github/workflows/release.yml" >&2
              exit 1
            }
          done < <(
            {
              sed -n 's/.*ASSET="\([^"]*\)".*/\1/p' install.sh
              sed -n "s/.*'\(0x1-memory-[^']*\)'.*/\1/p" npm/bin/0x1-memory.mjs
            } | sort -u
          )
      - name: Check manifest version parity
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          cargo_m = re.search(r'(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"', pathlib.Path("Cargo.toml").read_text())
          assert cargo_m, "Missing version in Cargo.toml"
          versions = {
              "Cargo.toml": cargo_m.group(1),
              "ui/package.json": json.loads(pathlib.Path("ui/package.json").read_text())["version"],
              "npm/package.json": json.loads(pathlib.Path("npm/package.json").read_text())["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Version mismatch across manifests: {versions}")
          PY
      - name: Enforce RimSelect in UI pages
        run: |
          if grep -rnE '<select([[:space:]]|>)' ui/src/pages/; then
            echo "Use <RimSelect /> instead of native <select> in ui/src/pages/" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Check npm launcher syntax
        run: node --check npm/bin/0x1-memory.mjs
      - name: Install & Build UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  rust:
    name: Rust (${{ matrix.os }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Tests
        env:
          OX1_MEMORY_DISABLE_ONNX: "1"
        run: cargo test --all-targets
