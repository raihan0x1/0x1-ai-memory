name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ui:
    name: Build Embedded UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  build-binary:
    name: Build (${{ matrix.asset }})
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: 0x1-memory-darwin-arm64
            ext: tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: 0x1-memory-linux-x64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: 0x1-memory-windows-x64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/0x1-memory" dist/0x1-memory
          chmod +x dist/0x1-memory
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist 0x1-memory
      - name: Package Windows archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/0x1-memory.exe" dist/0x1-memory.exe
          Compress-Archive -Path dist/0x1-memory.exe -DestinationPath "dist/${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.${{ matrix.ext }}

  sonar-gate:
    name: SonarCloud Quality Gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for SonarCloud Quality Gate
        run: bash scripts/sonar-gate.sh --sha "${{ github.sha }}" --branch main --wait 240

  publish:
    name: Publish GitHub Release
    needs: [build-binary, sonar-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum 0x1-memory-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            artifacts/0x1-memory-*
            artifacts/SHA256SUMS.txt

  publish-npm:
    name: Publish npm launcher (0x1-ai-memory)
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Sync README & publish thin launcher to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not set; skipping npm publish."
            exit 0
          fi
          cp ../README.md ./README.md
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
